<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Stylized R with a network node connection -->
  <g fill="none" stroke="#E63946" stroke-width="56" stroke-linecap="round" stroke-linejoin="round">
    <!-- R: vertical stem -->
    <line x1="120" y1="100" x2="120" y2="412"/>
    <!-- R: top arc -->
    <path d="M 120 100 L 280 100 A 90 90 0 0 1 280 280 L 120 280"/>
    <!-- R: leg -->
    <line x1="220" y1="280" x2="360" y2="412"/>
  </g>
  <!-- Network node accent (the connected dot) -->
  <circle cx="412" cy="120" r="36" fill="#E63946"/>
  <line x1="412" y1="120" x2="280" y2="190" stroke="#E63946" stroke-width="14" stroke-linecap="round" stroke-dasharray="4 18"/>
</svg>
